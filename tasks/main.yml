- name: Check if Helm command is installed
  ansible.builtin.shell: hash helm
  delegate_to: "{{ longhorn_delegate_to }}"
  run_once: true
  changed_when: false
  args:
    executable: "/bin/bash"

- name: Load required variables based on the OS type
  ansible.builtin.include_vars: "{{ item }}"
  with_first_found:
    - "{{ ansible_facts['distribution'] | lower }}-{{ ansible_facts['distribution_major_version'] }}.yml"
    - "{{ ansible_facts['distribution'] | lower }}-{{ ansible_facts['distribution_version'] }}.yml"
    - "{{ ansible_facts['distribution'] | lower }}-{{ ansible_facts['distribution_release'] }}.yml"
    - "{{ ansible_facts['distribution'] | lower }}.yml"
    - "{{ ansible_facts['os_family'] | lower }}.yml"
  tags:
    - always

- name: Set default action to only render template via Helm
  when:
    - longhorn_action is not defined
  ansible.builtin.set_fact:
    longhorn_action: "template"
  delegate_to: "{{ longhorn_delegate_to }}"
  run_once: true

- name: Execute OS specific tasks
  when: (longhorn_action != "delete") and
        (inventory_hostname in groups[longhorn_nodes_system] or inventory_hostname in groups[longhorn_nodes_user])
  ansible.builtin.include_tasks:
    file: "{{ item }}"
  with_first_found:
    - "os/{{ ansible_facts['distribution'] | lower }}-{{ ansible_facts['distribution_major_version'] }}.yml"
    - "os/{{ ansible_facts['distribution'] | lower }}-{{ ansible_facts['distribution_version'] }}.yml"
    - "os/{{ ansible_facts['distribution'] | lower }}-{{ ansible_facts['distribution_release'] }}.yml"
    - "os/{{ ansible_facts['distribution'] | lower }}.yml"
    - "os/{{ ansible_facts['os_family'] | lower }}.yml"

- name: Include tasks to execute requested action
  ansible.builtin.include_tasks:
    file: "tasks/{{ longhorn_action | lower }}.yml"
