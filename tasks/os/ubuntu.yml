- name: Install packages required for Longhorn
  ansible.builtin.package:
    name: "{{ longhorn_required_packages }}"
    state: "present"

- name: Ensure dm_crypt kernel module
  community.general.modprobe:
    name: dm_crypt
    state: present
  register: longhorn__dm_crypt_module_enabled
  until: longhorn__dm_crypt_module_enabled is succeeded
  retries: 10
  delay: 10
  failed_when: longhorn__dm_crypt_module_enabled is failure

- name: Ensure nfs kernel module
  community.general.modprobe:
    name: nfs
    state: present
  register: longhorn__nfs_module_enabled
  until: longhorn__nfs_module_enabled is succeeded
  retries: 10
  delay: 10
  failed_when: longhorn__nfs_module_enabled is failure

- name: Ensure iscsi_tcp kernel module
  community.general.modprobe:
    name: iscsi_tcp
    state: present
  register: longhorn__iscsi_tcp_module_enabled
  until: longhorn__iscsi_tcp_module_enabled is succeeded
  retries: 10
  delay: 10
  failed_when: longhorn__iscsi_tcp_module_enabled is failure
  notify:
    - restart multipathd

- name: Ensure iscsid
  ansible.builtin.service:
    name: "iscsid"
    state: "started"
    enabled: true

- name: Ensure multipathd blacklist for Longhorn
  when:
    - (longhorn_multipathd_blacklist_directory | default('') | length) > 0
    - (longhorn_multipathd_blacklist_file | default('') | length) > 0
  block:
    - name: Ensure multipathd conf.d directory
      ansible.builtin.file:
        path: "{{ longhorn_multipathd_blacklist_directory }}"
        state: directory
        mode: "{{ longhorn_multipathd_blacklist_directory_perm }}"
        owner: "root"
        group: "root"

    - name: Ensure multipathd blacklist file for Longhorn
      ansible.builtin.copy:
        src: "{{ longhorn_multipathd_blacklist_directory | regex_replace('^/', '') }}/{{ longhorn_multipathd_blacklist_file }}"
        dest: "{{ longhorn_multipathd_blacklist_directory }}/{{ longhorn_multipathd_blacklist_file }}"
        mode: "{{ longhorn_multipathd_blacklist_file_perm }}"
        owner: "root"
        group: "root"
      notify:
        - restart multipathd
